# @package _global_
# Classic C-alpha PCANN with a Gaussian distance distribution whose standard
# deviation is 10% of each edge distance.

defaults:
  - _self_
  - override /training_protocol: pcann_shared_gpu
  - override /lightning: edgepool.yaml

datamodule:
  val_fold: 0
  graph_builder:
    _target_: affex.data.transform.graph_builder.ResidueInterfaceEsmGraphBuilder
    radius: 5.0
    esm_dir: data/raw/ppb-affinity/esm2_hf_per_chain

lightning:
  model:
    node_feature_dim: 1280
    node_vocab_size: null
    node_embedding_dim: 64
    edge_feature_dim: 64
    distance_rbf_num_gaussians: 64
    distance_rbf_start: 0.0
    distance_rbf_stop: 50.0
    distance_rbf_relative_sigma_fraction: 0.10
    num_layers: 2
    use_foldx: false
