# @package _global_
# Frozen ESM-C 600M embeddings with native chain-break tokens at every boundary.

defaults:
  - _self_
  - override /training_protocol: pcann_shared_gpu
  - override /lightning: edgepool.yaml

datamodule:
  val_fold: 0
  graph_builder:
    _target_: affex.data.transform.graph_builder.ResidueInterfacePlmInteractGraphBuilder
    radius: 5.0
    plm_interact_dir: data/raw/ppb-affinity/esmc600_paired_native_break

lightning:
  model:
    node_feature_dim: 1152
    node_vocab_size: null
    node_embedding_dim: 64
    num_layers: 2
    use_foldx: false
