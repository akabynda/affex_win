# @package _global_
# PCANN variant with frozen base ESM2 embeddings from jointly encoded pairs.
# Generate embeddings first with scripts/data/run_plm_interact_extraction.py
# using --checkpoint-repo "" and --savedir data/raw/ppb-affinity/esm2_paired.

defaults:
  - _self_
  - override /training_protocol: pcann_shared_gpu
  - override /lightning: edgepool.yaml

datamodule:
  val_fold: 0
  graph_builder:
    _target_: affex.data.transform.graph_builder.ResidueInterfacePlmInteractGraphBuilder
    radius: 5.0
    plm_interact_dir: data/raw/ppb-affinity/esm2_paired

lightning:
  model:
    node_feature_dim: 1280
    node_vocab_size: null
    node_embedding_dim: 64
    num_layers: 2
    use_foldx: false
