# @package _global_
# EXP-043 configuration: PCANN, ESM residue-interface graphs, 25-fold cluster-aware CV.
# Run as a multirun over datamodule.val_fold=0..24 (see docs/training.md).

defaults:
  - _self_
  - override /training_protocol: pcann_shared_gpu
  - override /lightning: edgepool.yaml

datamodule:
  val_fold: 0  # override with 0..24 for the 25 folds
  graph_builder:
    _target_: affex.data.transform.graph_builder.ResidueInterfaceEsmGraphBuilder
    radius: 5.0
    esm_dir: data/raw/ppb-affinity/esm2_hf_per_chain

lightning:
  model:
    node_feature_dim: 1280
    node_vocab_size: null
    node_embedding_dim: 64
    num_layers: 2
    use_foldx: false
