# @package _global_
# Frozen ESM-2 embeddings with distance-aware GGGS linkers at every chain
# boundary and a 64-component Gaussian expansion of graph distances over 0..50 A.

defaults:
  - _self_
  - override /training_protocol: pcann_shared_gpu
  - override /lightning: edgepool.yaml

datamodule:
  val_fold: 0
  graph_builder:
    _target_: affex.data.transform.graph_builder.ResidueInterfacePlmInteractGraphBuilder
    radius: 5.0
    plm_interact_dir: data/raw/ppb-affinity/esm2_paired_linker_distance_gggs_all_boundaries

lightning:
  model:
    node_feature_dim: 1280
    node_vocab_size: null
    node_embedding_dim: 64
    edge_feature_dim: 64
    distance_rbf_num_gaussians: 64
    distance_rbf_start: 0.0
    distance_rbf_stop: 50.0
    num_layers: 2
    use_foldx: false
