# @package _global_
# Frozen canonical ESM-2 paired embeddings with a distance-aware GGGS linker
# between chains on the same side of the pair.

defaults:
  - _self_
  - override /training_protocol: pcann_shared_gpu
  - override /lightning: edgepool.yaml

datamodule:
  val_fold: 0
  graph_builder:
    _target_: affex.data.transform.graph_builder.ResidueInterfacePlmInteractGraphBuilder
    radius: 5.0
    plm_interact_dir: data/raw/ppb-affinity/esm2_paired_linker_distance_gggs

lightning:
  model:
    node_feature_dim: 1280
    node_vocab_size: null
    node_embedding_dim: 64
    num_layers: 2
    use_foldx: false
