# @package _global_
# Frozen ESM-2 embeddings from one sequence containing every peptide chain in
# structure-model order, separated by the residue token X.

defaults:
  - _self_
  - override /training_protocol: pcann_shared_gpu
  - override /lightning: edgepool.yaml

datamodule:
  val_fold: 0
  graph_builder:
    _target_: affex.data.transform.graph_builder.ResidueInterfacePlmInteractGraphBuilder
    radius: 5.0
    plm_interact_dir: data/raw/ppb-affinity/esm2_all_structure_chains_x

lightning:
  model:
    node_feature_dim: 1280
    node_vocab_size: null
    node_embedding_dim: 64
    num_layers: 2
    use_foldx: false
